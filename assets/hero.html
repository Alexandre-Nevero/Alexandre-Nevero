<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Alexandre Nevero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #111516;
      --paper: #e9e5db;
      --muted: #8a8a86;
      --rule: rgba(233, 229, 219, 0.2);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 2048px;
      height: 1276px;
      background: var(--bg);
      color: var(--paper);
      overflow: hidden;
    }
    body {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      padding: 88px 96px 72px;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--rule);
    }
    .mark {
      font-size: 20px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--paper);
    }
    .nav {
      display: flex;
      gap: 32px;
      font-size: 22px;
      font-weight: 400;
      letter-spacing: 0.01em;
      color: var(--paper);
    }
    .mast {
      display: grid;
      grid-template-columns: 1fr 780px;
      gap: 64px;
      align-items: start;
      padding-top: 28px;
    }
    h1 {
      font-family: "Playfair Display", Georgia, serif;
      font-weight: 600;
      font-size: 176px;
      line-height: 0.86;
      letter-spacing: -0.038em;
      color: var(--paper);
      font-kerning: normal;
    }
    .lede {
      margin-top: 52px;
      font-size: 34px;
      font-weight: 400;
      line-height: 1.42;
      color: var(--muted);
    }
    .portrait {
      width: 780px;
      height: 624px;
      object-fit: cover;
      object-position: center 18%;
      display: block;
    }
    .ledger {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      border-top: 1px solid var(--rule);
      margin-top: 72px;
    }
    .col { padding: 32px 40px 4px 0; }
    .col + .col {
      padding-left: 48px;
      border-left: 1px solid var(--rule);
    }
    .col-label {
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 32px;
    }
    .col-body {
      font-size: 38px;
      font-weight: 700;
      line-height: 1.24;
      letter-spacing: -0.018em;
      color: var(--paper);
    }
  </style>
</head>
<body>
  <header>
    <div class="mark">Dre</div>
    <div class="nav">
      <span>Work</span>
      <span>Stats</span>
      <span>Contact</span>
    </div>
  </header>
  <section class="mast">
    <div>
      <h1>Alexandre<br>Nevero</h1>
      <p class="lede">I work where business<br>judgment, product design, and<br>technical delivery have to<br>agree.</p>
    </div>
    <img class="portrait" src="sculpture.png" alt="">
  </section>
  <section class="ledger">
    <div class="col">
      <div class="col-label">Focus</div>
      <p class="col-body">Business models<br>that survive contact<br>with users.</p>
    </div>
    <div class="col">
      <div class="col-label">Portfolio</div>
      <p class="col-body">Products worth studying<br>before they are scaled.</p>
    </div>
    <div class="col">
      <div class="col-label">Signal</div>
      <p class="col-body">Open work,<br>public code,<br>visible progress.</p>
    </div>
  </section>
</body>
</html>
