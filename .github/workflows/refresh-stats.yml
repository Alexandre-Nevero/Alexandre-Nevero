name: Refresh GitHub activity snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: scripts/generate-stats.sh Alexandre-Nevero assets/stats.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git diff --quiet -- assets/stats.svg || {
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -- assets/stats.svg
            git commit -m "chore: refresh GitHub activity stats"
            git push
          }
